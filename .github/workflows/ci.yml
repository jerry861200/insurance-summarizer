name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system deps (tesseract + poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest tests/ -v

      - name: Run eval regression gate (regex-only baseline)
        run: |
          # Regex-only mode — no API key needed, fully deterministic.
          # Generous floor: current 3-case regex baseline averages 0.40-0.50;
          # 0.30 catches regressions in regex coverage without being flaky.
          OUTPUT=$(python -m eval.run_eval || true)
          echo "$OUTPUT"
          SCORE=$(echo "$OUTPUT" | grep -i "Average score" | head -1 | sed -E 's/.*Average score:\*\* ([0-9.]+)%.*/\1/')
          if [ -z "$SCORE" ]; then
            echo "ERROR: could not parse average score from eval output" >&2
            exit 1
          fi
          echo "Parsed avg score: $SCORE%"
          # bash float compare via awk; gate fails if score < 30.0
          awk -v s="$SCORE" 'BEGIN { exit (s + 0 < 30.0) ? 1 : 0 }'
